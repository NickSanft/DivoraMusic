name: Update visual snapshots

# Manual: trigger from the Actions tab when intentional design changes
# break visual regression, or to bootstrap baselines on a new platform
# (Linux/Mac/etc.). Generates fresh PNGs and commits them back to the
# branch it was run on.
on:
  workflow_dispatch:

permissions:
  contents: write

# Node 24 runtime for JS-based actions (silences the deprecation
# warning that fires every run on Node 20).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright (browsers + system deps)
        run: npx playwright install --with-deps chromium

      - name: Regenerate visual baselines
        run: npx playwright test tests/visual.spec.js --update-snapshots

      - name: Commit any new/changed baselines
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.js-snapshots
          if git diff --staged --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "ci: update visual baselines (${{ runner.os }})"
            git push
          fi
